<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kattanlabs S3 Quad Flight Deck</title>
<style>
:root {
  color-scheme: dark;
  --bg: #030712;
  --panel: rgba(15, 23, 42, 0.85);
  --border: rgba(30, 41, 59, 0.8);
  --cyan: #06b6d4;
  --cyan-glow: rgba(6, 182, 212, 0.3);
  --green: #10b981;
  --green-glow: rgba(16, 185, 129, 0.3);
  --red: #ef4444;
  --red-glow: rgba(239, 68, 68, 0.3);
  --text: #f8fafc;
  --muted: #64748b;
}

* { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

body {
  margin: 0; padding: 10px; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden; height: 100vh; display: flex; flex-direction: column;
}

main {
  max-width: 950px; width: 100%; margin: auto; display: flex; flex-direction: column; gap: 8px; height: 100%; justify-content: space-between;
}

header {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px;
  backdrop-filter: blur(12px);
}

.title-area h1 { font-size: 15px; margin: 0; font-weight: 800; letter-spacing: 0.05em; color: #e2e8f0; }
.title-area p { font-size: 10px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

.badges { display: flex; gap: 6px; align-items: center; }
.badge {
  padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; font-family: ui-monospace, monospace;
  background: #1e293b; color: var(--muted); border: 1px solid var(--border);
}
.badge.good { background: var(--green-glow); color: var(--green); border-color: rgba(16,185,129,0.4); box-shadow: 0 0 10px var(--green-glow); }
.badge.bad { background: var(--red-glow); color: var(--red); border-color: rgba(239,68,68,0.4); }

.control-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px;
}

button {
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  color: var(--text); background: #1e293b; font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all 0.1s ease; text-transform: uppercase; letter-spacing: 0.05em;
}
button:active { transform: scale(0.96); }
button:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-primary { background: #0891b2; border-color: #0e7490; color: #fff; box-shadow: 0 0 12px rgba(8,145,178,0.4); }
.btn-safe { background: #065f46; border-color: #047857; color: #34d399; box-shadow: 0 0 12px rgba(6,95,70,0.4); }
.btn-danger { background: #991b1b; border-color: #b91c1c; color: #fca5a5; box-shadow: 0 0 12px rgba(153,27,27,0.4); }

.telemetry-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
}
.metric {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
}
.metric .label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.metric .value { font-size: 15px; font-weight: 800; font-family: ui-monospace, monospace; color: var(--cyan); margin-top: 2px; }

.workspace {
  display: grid; grid-template-columns: 200px 1fr 200px; gap: 10px; flex: 1; min-height: 0;
}

/* Left Throttle Slider */
.slider-panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center;
}
.slider-panel h2 { font-size: 11px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

.track {
  position: relative; width: 56px; height: 100%; max-height: 190px;
  margin: auto; border: 2px solid #1e293b; border-radius: 28px;
  background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
  box-shadow: inset 0 0 15px rgba(0,0,0,0.8); display: flex; justify-content: center;
}
.track-line {
  position: absolute; top: 15px; bottom: 15px; width: 4px; background: rgba(100,116,139,0.2); border-radius: 2px;
}
.slider-knob {
  position: absolute; width: 46px; height: 46px; border-radius: 50%;
  left: 3px; top: calc(100% - 50px); background: linear-gradient(135deg, #06b6d4, #0891b2);
  border: 2px solid #cffafe; box-shadow: 0 0 15px var(--cyan-glow);
  pointer-events: none;
}

/* Center HUD */
.center-hud {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
}
.horizon-box {
  width: 90px; height: 90px; border-radius: 50%; border: 2px solid #334155; overflow: hidden; position: relative;
  background: #020617; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}
.horizon-bar {
  width: 140px; height: 140px; background: linear-gradient(to bottom, rgba(6,182,212,0.4) 50%, rgba(245,158,11,0.4) 50%);
  position: absolute; top: -25px; left: -25px; transition: transform 0.05s linear;
  display: flex; align-items: center; justify-content: center;
}
.horizon-bar::after { content: ""; width: 100%; height: 2px; background: #22d3ee; box-shadow: 0 0 8px #22d3ee; }
.crosshair { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.crosshair div { width: 10px; height: 10px; border: 2px solid var(--green); border-radius: 50%; }

/* Right Joy-Con */
.stick-panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center;
}
.stick-panel h2 { font-size: 11px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

.stick {
  position: relative; width: 100%; max-width: 190px; aspect-ratio: 1;
  margin: auto; border: 2px solid #1e293b; border-radius: 50%;
  background: radial-gradient(circle, #0f172a 0%, #020617 100%);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
}
.stick::before { content: ""; position: absolute; inset: 22%; border: 1px dashed rgba(100,116,139,0.3); border-radius: 50%; }
.stick-vert { position: absolute; top: 10%; bottom: 10%; left: 50%; width: 1px; background: rgba(100,116,139,0.2); }
.stick-horiz { position: absolute; top: 50%; left: 10%; right: 10%; height: 1px; background: rgba(100,116,139,0.2); }

.knob {
  position: absolute; width: 34%; aspect-ratio: 1; border-radius: 50%;
  left: 33%; top: 33%; background: linear-gradient(135deg, #06b6d4, #0891b2);
  border: 2px solid #cffafe; box-shadow: 0 0 15px var(--cyan-glow);
  pointer-events: none;
}

.readout { font: 11px ui-monospace, monospace; color: var(--cyan); background: rgba(2,6,23,0.6); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); width: 100%; }

.console-panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px;
  display: flex; flex-direction: column; gap: 4px;
}
.console-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: 0.05em; }
#log {
  height: 50px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  background: #020617; padding: 6px 8px; border-radius: 6px;
  font: 10px/1.2 ui-monospace, monospace; color: #94a3b8; border: 1px solid var(--border);
}
</style>
</head>
<body>
<main>
  <!-- HEADER -->
  <header>
    <div class="title-area">
      <h1>S3 QUADCOPTER FLIGHT DECK</h1>
      <p>Throttle Slider + Roll/Pitch Joy-Con</p>
    </div>
    <div class="badges">
      <span id="connection" class="badge bad">DISCONNECTED</span>
      <span id="armStatus" class="badge">DISARMED</span>
    </div>
  </header>

  <!-- ACTION BAR -->
  <div class="control-bar">
    <div style="display:flex; gap:6px;">
      <button id="connectBtn" class="btn-primary">Connect BLE</button>
      <button id="disconnectBtn">Disconnect</button>
    </div>
    <div style="display:flex; gap:6px;">
      <button id="armBtn" class="btn-safe" disabled>ARM</button>
      <button id="disarmBtn" disabled>DISARM</button>
      <button id="stopBtn" class="btn-danger" disabled>STOP</button>
    </div>
  </div>

  <!-- METRICS -->
  <div class="telemetry-grid">
    <div class="metric"><div class="label">Roll / Pitch</div><div class="value" id="attitude">0.0° / 0.0°</div></div>
    <div class="metric"><div class="label">Throttle PWM</div><div class="value" id="throttleReported">0 (0%)</div></div>
    <div class="metric"><div class="label">IMU Status</div><div class="value" id="imuBadge" style="color:var(--muted)">READY</div></div>
  </div>

  <!-- WORKSPACE -->
  <section class="workspace">
    <!-- LEFT THROTTLE SLIDER -->
    <div class="slider-panel">
      <h2>Throttle</h2>
      <div class="track" id="throttleTrack">
        <div class="track-line"></div>
        <div class="slider-knob" id="throttleKnob"></div>
      </div>
      <div class="readout" id="throttleReadout">Thr: 0%</div>
      <label style="font-size:10px; color:var(--muted); display:flex; align-items:center; gap:4px; cursor:pointer;">
        <input type="checkbox" id="holdThrottle" checked style="accent-color:var(--cyan);"> Hold
      </label>
    </div>

    <!-- CENTER HUD -->
    <div class="center-hud">
      <span style="font-size:9px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;">Attitude Fusion</span>
      <div class="horizon-box">
        <div class="horizon-bar" id="horizonBar"></div>
        <div class="crosshair"><div></div></div>
      </div>
      <div style="font-family:ui-monospace,monospace; font-size:11px; color:var(--cyan);" id="gyroReadout">STABLE</div>
    </div>

    <!-- RIGHT ROLL / PITCH JOY-CON -->
    <div class="stick-panel">
      <h2>Roll / Pitch</h2>
      <div class="stick" id="rightStick">
        <div class="stick-vert"></div>
        <div class="stick-horiz"></div>
        <div class="knob"></div>
      </div>
      <div class="readout" id="rightReadout">Roll: 0 | Pitch: 0</div>
    </div>
  </section>

  <!-- CONSOLE -->
  <section class="console-panel">
    <div class="console-header">
      <span>DIAGNOSTIC STREAM</span>
      <button id="refreshBtn" style="padding:1px 6px; font-size:9px;">Clear</button>
    </div>
    <div id="log"></div>
  </section>
</main>

<script>
  const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
  const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

  let bluetoothDevice = null, rxCharacteristic = null, txCharacteristic = null, isConnected = false;
  let joyState = { roll: 0, pitch: 0, yaw: 0, throttle: 0 };
  const logEl = document.getElementById('log');

  function logMessage(msg) {
    logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'S3_Quad_PWM' }], optionalServices: [SERVICE_UUID]
      });
      bluetoothDevice.addEventListener('gattserverdisconnected', () => setConnectionState(false));
      const server = await bluetoothDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      rxCharacteristic = await service.getCharacteristic(RX_UUID);
      txCharacteristic = await service.getCharacteristic(TX_UUID);
      await txCharacteristic.startNotifications();
      txCharacteristic.addEventListener('characteristicvaluechanged', handleTelemetry);
      setConnectionState(true);
      logMessage("BLE Connected successfully.");
    } catch (err) {
      logMessage("Connection Error: " + err);
      setConnectionState(false);
    }
  });

  document.getElementById('disconnectBtn').addEventListener('click', () => {
    if (bluetoothDevice?.gatt.connected) bluetoothDevice.gatt.disconnect();
    setConnectionState(false);
  });
  document.getElementById('refreshBtn').addEventListener('click', () => logEl.textContent = '');

  function setConnectionState(connected) {
    isConnected = connected;
    const badge = document.getElementById('connection');
    badge.textContent = connected ? "CONNECTED" : "DISCONNECTED";
    badge.className = connected ? "badge good" : "badge bad";
    ['armBtn', 'disarmBtn', 'stopBtn'].forEach(id => {
      document.getElementById(id).disabled = !connected;
    });
  }

  async function sendCommand(cmd) {
    if (!rxCharacteristic || !isConnected) return;
    try {
      await rxCharacteristic.writeValue(new TextEncoder().encode(cmd + "\n"));
    } catch (err) {}
  }

  document.getElementById('armBtn').addEventListener('click', () => sendCommand('ARM'));
  document.getElementById('disarmBtn').addEventListener('click', () => sendCommand('DISARM'));
  document.getElementById('stopBtn').addEventListener('click', () => sendCommand('STOP'));

  function handleTelemetry(event) {
    const raw = new TextDecoder().decode(event.target.value).trim();
    const data = {};
    raw.split(',').forEach(p => { const kv = p.split(':'); if(kv.length===2) data[kv[0]]=kv[1]; });

    if (data.ARM !== undefined) {
      const b = document.getElementById('armStatus');
      b.textContent = data.ARM === '1' ? "ARMED" : "DISARMED";
      b.className = data.ARM === '1' ? "badge good" : "badge";
    }
    if (data.R !== undefined && data.P !== undefined) {
      const r = parseFloat(data.R), p = parseFloat(data.P);
      document.getElementById('attitude').textContent = `${r.toFixed(1)}° / ${p.toFixed(1)}°`;
      document.getElementById('horizonBar').style.transform = `translateY(${p * 1.5}px) rotate(${-r}deg)`;
    }
    if (data.T !== undefined) {
      const tVal = parseFloat(data.T);
      document.getElementById('throttleReported').textContent = `${tVal.toFixed(0)} (${Math.round(tVal/2.55)}%)`;
    }
  }

  // 40Hz BLE Loop (Yaw is locked to 0)
  setInterval(() => {
    if (isConnected) sendCommand(`J,${joyState.roll},${joyState.pitch},0,${joyState.throttle}`);
  }, 40);

  function applyDeadzoneAndExpo(val, deadzone = 0.12) {
    if (Math.abs(val) < deadzone) return 0;
    const sign = Math.sign(val);
    const scaled = (Math.abs(val) - deadzone) / (1 - deadzone);
    return Math.round(sign * (scaled * scaled * 0.3 + scaled * 0.7) * 100);
  }

  // Throttle Slider Setup
  function initThrottleSlider() {
    const track = document.getElementById('throttleTrack');
    const knob = document.getElementById('throttleKnob');
    const readout = document.getElementById('throttleReadout');

    let active = false, touchId = null, posY = 1; // 1 = Bottom (0%)

    function update() {
      const trackHeight = track.clientHeight - 50;
      const topPx = posY * trackHeight;
      knob.style.top = topPx + 'px';

      const hold = document.getElementById('holdThrottle').checked;
      let rawT = (1 - posY);

      if (-posY < 0.02 && !hold) {
        joyState.throttle = 0;
      } else {
        joyState.throttle = Math.round(Math.max(0, Math.min(100, rawT * 100)));
      }
      readout.textContent = `Thr: ${joyState.throttle}%`;
    }

    function handleStart(e) {
      e.preventDefault();
      if (active) return;
      const t = e.changedTouches ? e.changedTouches[0] : e;
      active = true; touchId = t.identifier ?? null;
      move(t);
    }

    function handleMove(e) {
      e.preventDefault();
      if (!active) return;
      const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
      for (let t of touches) {
        if (t.identifier === touchId || touchId === null) { move(t); break; }
      }
    }

    function handleEnd(e) {
      e.preventDefault();
      if (!active) return;
      active = false; touchId = null;
      const hold = document.getElementById('holdThrottle').checked;
      if (!hold) { posY = 1; }
      update();
    }

    function move(t) {
      const rect = track.getBoundingClientRect();
      const trackHeight = rect.height - 50;
      let relY = t.clientY - (rect.top + 25);
      relY = Math.max(0, Math.min(trackHeight, relY));
      posY = relY / trackHeight;
      update();
    }

    track.addEventListener('pointerdown', handleStart);
    window.addEventListener('pointermove', e => { if (active) handleMove(e); });
    window.addEventListener('pointerup', e => { if (active) handleEnd(e); });
    update();
  }

  // Right Joy-Con Setup (Roll / Pitch)
  function initJoyCon() {
    const container = document.getElementById('rightStick');
    const knob = container.querySelector('.knob');
    const readout = document.getElementById('rightReadout');

    let active = false, touchId = null, posX = 0, posY = 0;

    function update() {
      const xPct = 33 + (posX * 33);
      const yPct = 33 + (posY * 33);
      knob.style.left = xPct + '%';
      knob.style.top = yPct + '%';

      joyState.roll = applyDeadzoneAndExpo(posX, 0.1);
      joyState.pitch = applyDeadzoneAndExpo(-posY, 0.1);
      readout.textContent = `Roll: ${joyState.roll} | Pitch: ${joyState.pitch}`;
    }

    function handleStart(e) {
      e.preventDefault();
      if (active) return;
      const t = e.changedTouches ? e.changedTouches[0] : e;
      active = true; touchId = t.identifier ?? null;
      move(t);
    }

    function handleMove(e) {
      e.preventDefault();
      if (!active) return;
      const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
      for (let t of touches) {
        if (t.identifier === touchId || touchId === null) { move(t); break; }
      }
    }

    function handleEnd(e) {
      e.preventDefault();
      if (!active) return;
      active = false; touchId = null;
      posX = 0; posY = 0;
      update();
    }

    function move(t) {
      const rect = container.getBoundingClientRect();
      const r = rect.width / 2;
      let dx = t.clientX - (rect.left + r);
      let dy = t.clientY - (rect.top + r);
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > r * 0.75) {
        dx = (dx / dist) * (r * 0.75);
        dy = (dy / dist) * (r * 0.75);
      }
      posX = dx / (r * 0.75);
      posY = dy / (r * 0.75);
      update();
    }

    container.addEventListener('pointerdown', handleStart);
    window.addEventListener('pointermove', e => { if (active) handleMove(e); });
    window.addEventListener('pointerup', e => { if (active) handleEnd(e); });
    update();
  }

  initThrottleSlider();
  initJoyCon();
</script>
</body>
</html>
