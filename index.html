<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kattanlabs S3 Quad Bench HUD</title>
<style>
:root {
  color-scheme: dark;
  --bg: #030712;
  --panel: rgba(15, 23, 42, 0.85);
  --border: rgba(30, 41, 59, 0.8);
  --cyan: #06b6d4;
  --cyan-glow: rgba(6, 182, 212, 0.3);
  --green: #10b981;
  --green-glow: rgba(16, 185, 129, 0.3);
  --red: #ef4444;
  --red-glow: rgba(239, 68, 68, 0.3);
  --text: #f8fafc;
  --muted: #64748b;
}

* { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

body {
  margin: 0; padding: 12px; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden; height: 100vh; display: flex; flex-direction: column;
}

main {
  max-width: 800px; width: 100%; margin: auto; display: flex; flex-direction: column; gap: 10px; height: 100%; justify-content: space-between;
}

header {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px;
  backdrop-filter: blur(12px);
}

.title-area h1 { font-size: 15px; margin: 0; font-weight: 800; letter-spacing: 0.05em; color: #e2e8f0; }
.title-area p { font-size: 10px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

.badges { display: flex; gap: 6px; align-items: center; }
.badge {
  padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; font-family: ui-monospace, monospace;
  background: #1e293b; color: var(--muted); border: 1px solid var(--border);
}
.badge.good { background: var(--green-glow); color: var(--green); border-color: rgba(16,185,129,0.4); box-shadow: 0 0 10px var(--green-glow); }
.badge.bad { background: var(--red-glow); color: var(--red); border-color: rgba(239,68,68,0.4); }

.control-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px;
}

button {
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px;
  color: var(--text); background: #1e293b; font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all 0.1s ease; text-transform: uppercase; letter-spacing: 0.05em;
}
button:active { transform: scale(0.96); }
button:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-primary { background: #0891b2; border-color: #0e7490; color: #fff; box-shadow: 0 0 12px rgba(8,145,178,0.4); }
.btn-safe { background: #065f46; border-color: #047857; color: #34d399; box-shadow: 0 0 12px rgba(6,95,70,0.4); }
.btn-danger { background: #991b1b; border-color: #b91c1c; color: #fca5a5; box-shadow: 0 0 12px rgba(153,27,27,0.4); }

.telemetry-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
}
.metric {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
}
.metric .label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.metric .value { font-size: 15px; font-weight: 800; font-family: ui-monospace, monospace; color: var(--cyan); margin-top: 2px; }

.workspace {
  display: grid; grid-template-columns: 220px 1fr; gap: 12px; flex: 1; min-height: 0;
}

.slider-panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center;
}
.slider-panel h2 { font-size: 11px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

.track {
  position: relative; width: 64px; height: 100%; max-height: 220px;
  margin: auto; border: 2px solid #1e293b; border-radius: 32px;
  background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
  box-shadow: inset 0 0 15px rgba(0,0,0,0.8); display: flex; justify-content: center;
}
.track-line {
  position: absolute; top: 15px; bottom: 15px; width: 4px; background: rgba(100,116,139,0.2); border-radius: 2px;
}

.knob {
  position: absolute; width: 52px; height: 52px; border-radius: 50%;
  left: 4px; top: calc(100% - 56px); background: linear-gradient(135deg, #06b6d4, #0891b2);
  border: 2px solid #cffafe; box-shadow: 0 0 15px var(--cyan-glow);
  pointer-events: none; transition: background 0.1s;
}

.readout { font: 12px ui-monospace, monospace; color: var(--cyan); background: rgba(2,6,23,0.6); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); width: 100%; font-weight: bold; }

.center-hud {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
}

.horizon-box {
  width: 100px; height: 100px; border-radius: 50%; border: 2px solid #334155; overflow: hidden; position: relative;
  background: #020617; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}
.horizon-bar {
  width: 150px; height: 150px; background: linear-gradient(to bottom, rgba(6,182,212,0.4) 50%, rgba(245,158,11,0.4) 50%);
  position: absolute; top: -25px; left: -25px; transition: transform 0.05s linear;
  display: flex; align-items: center; justify-content: center;
}
.horizon-bar::after { content: ""; width: 100%; height: 2px; background: #22d3ee; box-shadow: 0 0 8px #22d3ee; }
.crosshair { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.crosshair div { width: 10px; height: 10px; border: 2px solid var(--green); border-radius: 50%; }

.console-panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px;
  display: flex; flex-direction: column; gap: 4px;
}
.console-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: 0.05em; }
#log {
  height: 60px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  background: #020617; padding: 6px 8px; border-radius: 6px;
  font: 10px/1.2 ui-monospace, monospace; color: #94a3b8; border: 1px solid var(--border);
}
</style>
</head>
<body>
<main>
  <!-- TOP HEADER -->
  <header>
    <div class="title-area">
      <h1>S3 QUADCOPTER BENCH HUD</h1>
      <p>Single-Axis Throttle Control</p>
    </div>
    <div class="badges">
      <span id="connection" class="badge bad">DISCONNECTED</span>
      <span id="armStatus" class="badge">DISARMED</span>
    </div>
  </header>

  <!-- ACTION CONTROL BAR -->
  <div class="control-bar">
    <div style="display:flex; gap:6px;">
      <button id="connectBtn" class="btn-primary">Connect BLE</button>
      <button id="disconnectBtn">Disconnect</button>
    </div>
    <div style="display:flex; gap:6px;">
      <button id="armBtn" class="btn-safe" disabled>ARM</button>
      <button id="disarmBtn" disabled>DISARM</button>
      <button id="stopBtn" class="btn-danger" disabled>STOP</button>
    </div>
  </div>

  <!-- TELEMETRY METRICS -->
  <div class="telemetry-grid">
    <div class="metric"><div class="label">Roll / Pitch</div><div class="value" id="attitude">0.0° / 0.0°</div></div>
    <div class="metric"><div class="label">ToF Distance</div><div class="value" id="distance">8190 mm</div></div>
    <div class="metric"><div class="label">Throttle PWM</div><div class="value" id="throttleReported">0 (0%)</div></div>
  </div>

  <!-- WORKSPACE: THROTTLE SLIDER + ARTIFICIAL HORIZON -->
  <section class="workspace">
    <!-- VERTICAL THROTTLE SLIDER ONLY -->
    <div class="slider-panel">
      <h2>Throttle Slider</h2>
      <div class="track" id="throttleTrack">
        <div class="track-line"></div>
        <div class="knob" id="throttleKnob"></div>
      </div>
      <div class="readout" id="throttleReadout">Throttle: 0%</div>
      <label style="font-size:10px; color:var(--muted); display:flex; align-items:center; gap:4
